name: Restore Typst WASM cache
description: Reuse compiled Typst WASM after dependency installation
outputs:
  hash:
    description: Content hash of the Typst WASM build inputs
    value: ${{ steps.fingerprint.outputs.hash }}
runs:
  using: composite
  steps:
    - name: Fingerprint Typst WASM inputs
      id: fingerprint
      shell: bash
      run: |
        hash=$(node packages/xl-typst-compiler/scripts/wasm-cache.mjs)
        echo "hash=$hash" >> "$GITHUB_OUTPUT"
    # Cache just the distributable (~25 MB), not the multi-GB Rust target tree.
    # ensure-wasm.mjs still verifies its content hash before using this output.
    - name: Cache Typst WASM
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: packages/xl-typst-compiler/pkg
        key: typst-wasm-v3-${{ steps.fingerprint.outputs.hash }}
