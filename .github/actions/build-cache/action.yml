name: Restore build caches
description: Reuse compiled Typst WASM and Vite Task results after dependency installation
inputs:
  task-cache-scope:
    description: Separate independently populated task caches by job
    required: true
runs:
  using: composite
  steps:
    # Cache just the distributable (~25 MB), not the multi-GB Rust target tree.
    # ensure-wasm.mjs still verifies its content hash before using this output.
    - name: Cache Typst WASM
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: packages/xl-typst-compiler/pkg
        key: typst-wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/xl-typst-compiler/rust/Cargo.toml', 'packages/xl-typst-compiler/rust/Cargo.lock', 'packages/xl-typst-compiler/rust/rust-toolchain.toml', 'packages/xl-typst-compiler/rust/src/**', 'packages/xl-typst-compiler/scripts/ensure-wasm.mjs', 'packages/xl-typst-compiler/package.json', 'packages/xl-typst-compiler/node_modules/wasm-pack/package.json') }}

    # setup-vp caches the package-manager store, not task results. Installation
    # can replace node_modules, so callers must install before restoring this.
    # Task fingerprints handle source/dependency invalidation; rolling keys
    # allow each successful run to save new results (Actions caches are immutable).
    - name: Cache Vite Task results
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: node_modules/.vite/task-cache
        key: vite-task-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.task-cache-scope }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          vite-task-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.task-cache-scope }}-
