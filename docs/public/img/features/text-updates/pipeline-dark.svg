<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 395' width='900' height='395' role='img' aria-label='The pipeline of a text update'><title>The pipeline of a text update</title><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#9aa4af'/></marker></defs><rect width='900' height='395' fill='#0d1117'/><rect x='20' y='20' width='200' height='70' rx='10' fill='#161b22' stroke='#3a414b' stroke-width='1.5'/><text x='120.0' y='46' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#e6edf3'>Document</text><text x='120.0' y='67' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#9aa4af'>Block JSON with IDs,</text><text x='120.0' y='84' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#9aa4af'>props, nesting, comments</text><line x1='220' y1='55' x2='330' y2='55' stroke='#9aa4af' stroke-width='1.6' marker-end='url(#arrow)'/><text x='275.0' y='49.0' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#9aa4af'>read (serialize)</text><rect x='330' y='20' width='200' height='70' rx='10' fill='#161b22' stroke='#3a414b' stroke-width='1.5'/><text x='430.0' y='46' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#e6edf3'>Text</text><text x='430.0' y='67' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#9aa4af'>markdown, HTML</text><text x='430.0' y='84' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#9aa4af'>or plain text</text><line x1='530' y1='55' x2='640' y2='55' stroke='#9aa4af' stroke-width='1.6' marker-end='url(#arrow)'/><text x='585.0' y='49.0' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#9aa4af'>client edits</text><rect x='640' y='20' width='240' height='70' rx='10' fill='#14243d' stroke='#6ea8fe' stroke-width='1.5'/><text x='760.0' y='46' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#e6edf3'>Edited text</text><text x='760.0' y='67' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#9aa4af'>sent back with PUT</text><rect x='20' y='140' width='260' height='82' rx='10' fill='#161b22' stroke='#3a414b' stroke-width='1.5'/><text x='150.0' y='166' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#e6edf3'>1. Project</text><text x='150.0' y='187' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#9aa4af'>render and parse the document:</text><text x='150.0' y='204' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#9aa4af'>the view, linked to the document blocks</text><rect x='320' y='140' width='260' height='82' rx='10' fill='#161b22' stroke='#3a414b' stroke-width='1.5'/><text x='450.0' y='166' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#e6edf3'>2. Parse</text><text x='450.0' y='187' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#9aa4af'>the edited text gives</text><text x='450.0' y='204' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#9aa4af'>the blocks of the text</text><rect x='620' y='140' width='260' height='82' rx='10' fill='#161b22' stroke='#3a414b' stroke-width='1.5'/><text x='750.0' y='166' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#e6edf3'>3. Align</text><text x='750.0' y='187' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#9aa4af'>pair view blocks with text blocks</text><text x='750.0' y='204' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#9aa4af'>by the location of their text</text><rect x='20' y='260' width='260' height='82' rx='10' fill='#161b22' stroke='#3a414b' stroke-width='1.5'/><text x='150.0' y='286' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#e6edf3'>4. Merge and plan</text><text x='150.0' y='307' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#9aa4af'>three-way merge of each pair:</text><text x='150.0' y='324' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#9aa4af'>the target document</text><rect x='320' y='260' width='260' height='82' rx='10' fill='#161b22' stroke='#3a414b' stroke-width='1.5'/><text x='450.0' y='286' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#e6edf3'>5. Diff</text><text x='450.0' y='307' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#9aa4af'>target against the document:</text><text x='450.0' y='324' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#9aa4af'>operations by block ID</text><rect x='620' y='260' width='260' height='82' rx='10' fill='#11291a' stroke='#56d364' stroke-width='1.5'/><text x='750.0' y='286' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#e6edf3'>6. Apply</text><text x='750.0' y='307' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#9aa4af'>small ProseMirror steps;</text><text x='750.0' y='324' text-anchor='middle' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#9aa4af'>a rebase first for an older base</text><line x1='280' y1='181' x2='320' y2='181' stroke='#9aa4af' stroke-width='1.6' marker-end='url(#arrow)'/><line x1='580' y1='181' x2='620' y2='181' stroke='#9aa4af' stroke-width='1.6' marker-end='url(#arrow)'/><path d='M 750 222 L 750 241 L 150 241 L 150 258' fill='none' stroke='#9aa4af' stroke-width='1.6' marker-end='url(#arrow)'/><line x1='280' y1='301' x2='320' y2='301' stroke='#9aa4af' stroke-width='1.6' marker-end='url(#arrow)'/><line x1='580' y1='301' x2='620' y2='301' stroke='#9aa4af' stroke-width='1.6' marker-end='url(#arrow)'/><line x1='760' y1='90' x2='450' y2='138' stroke='#9aa4af' stroke-width='1.6' marker-end='url(#arrow)'/><text x='20' y='380' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#9aa4af'>Data that the text does not show stays: the merge takes it from the document, and the steps change only what changed.</text></svg>