packages:
  - "packages/*"
  - "examples/*/*"
  - "playground"
  - "fumadocs"
  - "docs"
  - "shared"
  - "tests"
preferWorkspacePackages: true
linkWorkspacePackages: true
gitChecks: false
minimumReleaseAge: 1440
publicHoistPattern:
  # We have been preferring to use `prosemirror-*` packages instead of `@tiptap/pm` packages
  - "prosemirror-*"
overrides:
  "@headlessui/react": "^2.2.4"
  # fumadocs-core still declares @shikijs/rehype ^3 while the rest of the
  # workspace (code-block, docs, fumadocs-twoslash) is on shiki 4.4.3 - two
  # shiki identities in one graph make the docs' rehype transformer types
  # clash ("ShikiTransformer | ShikiTransformer"). Force one shiki everywhere.
  "shiki": "^4.4.3"
  "@shikijs/rehype": "^4.4.3"
  "@shikijs/types": "^4.4.3"
  "@tiptap/core": "^3.31.3"
  "@tiptap/pm": "^3.31.3"
  # Keep ProseMirror's model identity shared with @tiptap/pm and Yjs plugins.
  "prosemirror-model": "1.25.12"
  # Mapping has private fields, so separate prosemirror-transform versions are
  # incompatible types. Keep direct imports and prosemirror-state/@tiptap/pm
  # on one resolution (1.12.0 vs 1.12.1 breaks the core build).
  "prosemirror-transform": "^1.12.1"
  # Keep Vitest's @types/node and jsdom peers identical across the workspace.
  # Otherwise pnpm can create separate runner instances, so test imports and
  # the CLI do not share snapshot state.
  "@types/node": "25.9.5"
  "jsdom": "^29.0.2"
  "@y/y": "14.0.0-rc.23"
  "@y/prosemirror": "2.0.0-6"
  "lib0": "^1.0.0-rc.34"
  vite@*: "catalog:"
  vitest@*: "catalog:"
packageExtensions:
  # Provide the optional HTML reporter through every vite-plus instance so
  # tests/ and the Node suites resolve the same Vitest peer graph. Keep this
  # version aligned with the bundled runner and the toolchain catalog.
  vite-plus:
    dependencies:
      "@vitest/ui": "5.0.3"
allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: true
  msw: true
  unrs-resolver: true
  canvas: false
  sharp: false
  workerd: false
  leveldown: false
  # wasm-pack's binary shim self-installs on first run; no install script.
  wasm-pack: false
patchedDependencies:
  { "@y/prosemirror@2.0.0-6": patches/@y__prosemirror@2.0.0-6.patch }
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  vitest: 5.0.3
  "@vitest/browser-playwright": 5.0.3
  "@vitest/ui": 5.0.3
minimumReleaseAgeExclude:
  - vite-plus
  - lib0
  - "@y/y"
  - "@y/prosemirror"
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  # The Typst compiler family is pinned to a fresh rc line; excluded from the
  # release-age quarantine by exact name (plus the node compiler's
  # per-platform binaries) rather than waiving the whole scope.
  - "@myriaddreamin/typst.ts"
  - "@myriaddreamin/typst-ts-web-compiler"
  - "@myriaddreamin/typst-ts-renderer"
  - "@myriaddreamin/typst-ts-node-compiler"
  - "@myriaddreamin/typst-ts-node-compiler-*"
  - vitest
  - "@vitest/*"

# pdfjs-dist pulls @napi-rs/canvas (native binaries) for Node-side
# rendering, which we never do - pdf.js only runs in the browser suite.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
